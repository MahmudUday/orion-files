name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Prepare source
        id: prep
        run: | if [ -f orion-src.zip ]; then mkdir -p _build unzip -oq orion-src.zip -d _build echo "dir=_build" >> "$GITHUB_OUTPUT" else echo "dir=." >> "$GITHUB_OUTPUT" fi 
      - name: Build debug APK
        run: gradle -p "${{ steps.prep.outputs.dir }}" assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp "${{ steps.prep.outputs.dir }}"/app/build/outputs/apk/debug/app-debug.apk OrionFiles.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OrionFiles-apk
          path: OrionFiles.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Orion Files build ${{ github.run_number }}
          files: OrionFiles.apk
